[project]
name = "motionvendi"
version = "0.1.0"
description = "Gated motion-diversity measurement and curation for egocentric robot-learning data (EgoVerse)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
data = ["zarr>=3.0"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["motionvendi"]
